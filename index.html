<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SismoAlert Chile - Sistema Integral</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; }
        #map { height: 100vh; width: 100%; }
        
        /* Panel Único Flotante */
        .control-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(30, 30, 30, 0.95); padding: 20px; border-radius: 12px;
            width: 320px; border: 1px solid #444; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            max-height: 90vh; display: flex; flex-direction: column;
        }

        h1 { font-size: 1.3rem; margin: 0; color: #ff4d4d; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .offline { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        
        .slider-container { margin-top: 15px; }
        label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff4d4d; }
        .val-display { float: right; color: #fff; font-weight: bold; }

        #result-box { 
            margin-top: 15px; padding: 12px; background: #222; 
            border-left: 4px solid #f1c40f; border-radius: 4px;
        }

        /* Listado con Scroll */
        #sismo-list-container {
            margin-top: 15px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        /* Scrollbar personalizado para que no sea feo */
        #sismo-list-container::-webkit-scrollbar { width: 4px; }
        #sismo-list-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .sismo-item { 
            background: rgba(255,255,255,0.05); padding: 10px; margin-bottom: 6px; 
            border-radius: 4px; cursor: pointer; border-left: 3px solid #ff4d4d; transition: 0.2s;
        }
        .sismo-item:hover { background: rgba(255,255,255,0.1); }
        .sismo-item b { color: #ff4d4d; font-size: 0.9rem; }
        .sismo-item p { margin: 3px 0 0; font-size: 0.7rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="control-panel">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
            <span style="font-size: 0.7rem;">SISTEMA: <span id="status-text">CONECTANDO...</span></span>
            <span id="status-dot" class="status-dot"></span>
        </div>
        <h1>SismoAlert <span>Chile</span></h1>
        
        <div class="slider-container">
            <label>RADIO DE COBERTURA <span id="range-val" class="val-display">1300 km</span></label>
            <input type="range" id="range-slider" min="100" max="5000" value="1300">
        </div>

        <div class="slider-container">
            <label>SENSIBILIDAD MÍNIMA <span id="mag-val" class="val-display">1 Mag</span></label>
            <input type="range" id="mag-slider" min="0" max="9" step="0.1" value="1">
        </div>

        <div id="result-box">
            <span style="font-size: 0.7rem; color: #888;">IA: ESTIMACIÓN LOCAL</span>
            <div id="prediction-val" style="font-size: 1.4rem; font-weight: bold; color: #f1c40f;">- Mag</div>
        </div>

        <!-- El nuevo listado va aquí adentro -->
        <div id="sismo-list-container">
            <span style="font-size: 0.7rem; color: #666; display: block; margin-bottom: 10px;">SISMOS EN TU RANGO:</span>
            <div id="sismo-container"></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = 'https://sismoalert.onrender.com';
        const USGS_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';

        let centerLat = -33.44;
        let centerLng = -70.66;
        const map = L.map('map').setView([centerLat, centerLng], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let sismosLayer = L.layerGroup().addTo(map);
        let coverageCircle = null;

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI / 180;
            const dLon = (lon2-lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function updateSismos() {
            try {
                const range = parseFloat(document.getElementById('range-slider').value);
                const minMag = parseFloat(document.getElementById('mag-slider').value);
                const container = document.getElementById('sismo-container');
                
                if (coverageCircle) {
                    coverageCircle.setRadius(range * 1000);
                    coverageCircle.setLatLng([centerLat, centerLng]);
                } else {
                    coverageCircle = L.circle([centerLat, centerLng], {
                        radius: range * 1000, color: '#ff4d4d', fillOpacity: 0.05, weight: 1, dashArray: '5, 10'
                    }).addTo(map);
                }

                const response = await fetch(USGS_URL);
                const data = await response.json();
                
                sismosLayer.clearLayers();
                container.innerHTML = ""; 

                const sismosFiltrados = data.features.filter(f => {
                    const d = getDistance(centerLat, centerLng, f.geometry.coordinates[1], f.geometry.coordinates[0]);
                    return d <= range && f.properties.mag >= minMag;
                }).sort((a, b) => b.properties.mag - a.properties.mag);

                sismosFiltrados.forEach(f => {
                    const coords = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
                    const mag = f.properties.mag;
                    const place = f.properties.place;

                    const m = L.circleMarker(coords, {
                        radius: mag * 2.5, fillColor: "#ff4d4d", color: "#fff", weight: 1, fillOpacity: 0.7
                    }).bindPopup(`<b>Sismo Real</b><br>Mag: ${mag}<br>${place}`).addTo(sismosLayer);

                    const item = document.createElement('div');
                    item.className = 'sismo-item';
                    item.innerHTML = `<b>${mag} Mag</b><p>${place}</p>`;
                    item.onclick = () => { map.setView(coords, 8); m.openPopup(); };
                    container.appendChild(item);
                });

                if(sismosFiltrados.length === 0) {
                    container.innerHTML = "<p style='font-size:0.7rem; color:#555;'>Sin sismos en la zona.</p>";
                }

            } catch (e) { console.error(e); }
        }

        document.getElementById('range-slider').oninput = function() {
            document.getElementById('range-val').innerText = this.value + " km";
            updateSismos();
        };
        document.getElementById('mag-slider').oninput = function() {
            document.getElementById('mag-val').innerText = this.value + " Mag";
            updateSismos();
        };

        async function checkStatus() {
            try {
                const res = await fetch(API_URL + '/');
                if (res.ok) {
                    document.getElementById('status-dot').className = 'status-dot online';
                    document.getElementById('status-text').innerText = 'CONECTADO';
                }
            } catch (e) {
                document.getElementById('status-dot').className = 'status-dot offline';
                document.getElementById('status-text').innerText = 'OFFLINE';
            }
        }

        let currentMarker = null;
        map.on('click', async function(e) {
            const { lat, lng } = e.latlng;
            if(currentMarker) map.removeLayer(currentMarker);
            currentMarker = L.marker([lat, lng]).addTo(map).bindPopup("IA analizando...").openPopup();
            try {
                const res = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ latitud: lat, longitud: lng })
                });
                const d = await res.json();
                if (res.ok) {
                    document.getElementById('result-box').style.display = 'block';
                    document.getElementById('prediction-val').innerText = d.magnitud_estimada + " Mag";
                    currentMarker.setPopupContent(`<b>IA: Probable ${d.magnitud_estimada}</b>`).openPopup();
                }
            } catch (err) { currentMarker.setPopupContent("IA no disponible").openPopup(); }
        });

        function localizarUsuario() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((position) => {
                    centerLat = position.coords.latitude;
                    centerLng = position.coords.longitude;
                    L.circleMarker([centerLat, centerLng], { radius: 8, fillColor: "#3498db", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(map).bindPopup("Tú");
                    map.setView([centerLat, centerLng], 6);
                    updateSismos();
                }, () => updateSismos());
            } else { updateSismos(); }
        }

        localizarUsuario();
        checkStatus();
    </script>
</body>
</html>
