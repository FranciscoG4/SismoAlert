<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SismoAlert Chile - Sistema de Monitoreo Crítico</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #0a0a0a; color: #ffffff; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(15, 15, 15, 0.98); padding: 25px; border-radius: 18px;
            width: 350px; border: 1px solid #333; box-shadow: 0 15px 50px rgba(0,0,0,0.95);
            max-height: 92vh; display: flex; flex-direction: column;
            backdrop-filter: blur(12px);
        }

        #alarm-status {
            font-size: 0.7rem; font-weight: 900; color: #ff4d4d;
            text-align: center; margin-bottom: 10px; display: none;
            animation: blink 0.8s infinite; border: 1px solid #ff4d4d;
            padding: 8px; border-radius: 8px; background: rgba(255, 77, 77, 0.1);
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        .arm-system-container {
            margin-bottom: 20px; padding: 15px; border-radius: 12px;
            background: #1a1a1a; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333; transition: all 0.3s;
        }
        .system-armed-bg { border-color: #2ecc71; box-shadow: inset 0 0 10px rgba(46, 204, 113, 0.2); }
        .arm-text { font-size: 0.75rem; font-weight: 800; color: #666; letter-spacing: 1px; }
        .active-text { color: #2ecc71; }

        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-switch {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 24px;
        }
        .slider-switch:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider-switch { background-color: #2ecc71; }
        input:checked + .slider-switch:before { transform: translateX(26px); }

        h1 { font-size: 1.6rem; margin: 0; color: #ff4d4d; letter-spacing: -1px; font-weight: 800; margin-bottom: 15px; }
        .slider-container { background: #151515; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #222; }
        label { font-size: 0.7rem; color: #888; display: block; margin-bottom: 8px; font-weight: bold; }
        .val-badge { color: #fff; float: right; background: #252525; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
        input[type=range] { width: 100%; accent-color: #ff4d4d; cursor: pointer; }

        #list-wrapper { overflow-y: auto; flex-grow: 1; margin-top: 5px; }
        .item { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #282828; }
        .sismo-real { border-right: 5px solid #ff4d4d; border-left: 1px solid rgba(255, 77, 77, 0.3); }
        .anomalia-ia { border-right: 5px solid #f1c40f; opacity: 0.8; }
        .mag-text { font-size: 1.3rem; font-weight: 900; display: block; }
        .place { font-size: 0.8rem; color: #999; display: block; margin-bottom: 4px; }
        .sources-badge { font-size: 0.65rem; background: #2d2d2d; color: #aaa; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
    <div class="control-panel">
        <div id="alarm-status">⚠️ ALERTA: ACTIVIDAD SÍSMICA DETECTADA ⚠️</div>
        <h1>SismoAlert Chile</h1>

        <div class="arm-system-container" id="arm-box">
            <span class="arm-text" id="arm-label">SISTEMA DESARMADO</span>
            <label class="switch">
                <input type="checkbox" id="arm-toggle">
                <span class="slider-switch"></span>
            </label>
        </div>
        
        <div class="slider-container">
            <label>RADIO DE COBERTURA <span id="range-val" class="val-badge">2000 km</span></label>
            <input type="range" id="range-slider" min="100" max="8000" value="2000">
        </div>

        <div class="slider-container">
            <label>SENSIBILIDAD MÍNIMA <span id="mag-val" class="val-badge">1.0 Mag</span></label>
            <input type="range" id="mag-slider" min="0" max="9" step="0.1" value="1">
        </div>

        <div id="list-wrapper">
            <div id="sismos-container"></div>
            <div id="anomalias-container"></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = 'https://sismoalert.onrender.com';
        
        // Motor de Audio Sintético (Evita bloqueos de navegador)
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let alarmaInterval = null;

        function iniciarSirena() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!oscillator) {
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();

                // Efecto de sirena oscilante
                const sweepAlarma = () => {
                    if (oscillator) {
                        oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                        oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 1.0);
                    }
                };
                sweepAlarma();
                alarmaInterval = setInterval(sweepAlarma, 1000);
            }
        }

        function detenerSirena() {
            if (oscillator) {
                clearInterval(alarmaInterval);
                oscillator.stop();
                oscillator.disconnect();
                oscillator = null;
            }
            document.getElementById('alarm-status').style.display = 'none';
        }

        let miUbicacion = { lat: -33.44, lng: -70.66 };
        let sismosInmutables = new Map(); 
        let sistemaArmado = false;

        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([miUbicacion.lat, miUbicacion.lng], 4);
        map.zoomControl.setPosition('topright');
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let sismosLayer = L.layerGroup().addTo(map);
        let circuloRango = L.circle([miUbicacion.lat, miUbicacion.lng], {
            radius: 2000 * 1000, color: '#ff4d4d', fillOpacity: 0.04, weight: 1.5, dashArray: '10, 10'
        }).addTo(map);

        document.getElementById('arm-toggle').addEventListener('change', function(e) {
            sistemaArmado = e.target.checked;
            const label = document.getElementById('arm-label');
            const box = document.getElementById('arm-box');
            
            // "Despertar" el sistema de audio con la acción del usuario
            if (sistemaArmado) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                label.innerText = "SISTEMA ARMADO";
                label.classList.add('active-text');
                box.classList.add('system-armed-bg');
                updateSismos();
            } else {
                label.innerText = "SISTEMA DESARMADO";
                label.classList.remove('active-text');
                box.classList.remove('system-armed-bg');
                detenerSirena();
            }
        });

        async function updateSismos() {
            const radioKm = document.getElementById('range-slider').value;
            const minMag = document.getElementById('mag-slider').value;
            circuloRango.setRadius(radioKm * 1000);

            try {
                // Consultamos directamente al backend multifuente activo en Render
                const res = await fetch(`${API_URL}/sismos_unificados`);
                const data = await res.json();
                
                // Filtramos localmente según los controles interactivos del usuario
                const processed = data.filter(s => {
                    const d = map.distance([miUbicacion.lat, miUbicacion.lng], [s.lat, s.lng]) / 1000;
                    return d <= radioKm && s.mag_original >= minMag;
                });
                
                sismosLayer.clearLayers();
                document.getElementById('sismos-container').innerHTML = "";
                document.getElementById('anomalias-container').innerHTML = "";

                let haySismoRojo = false;

                processed.forEach(s => {
                    // Mantener estado de anomalías inmutable
                    if (!sismosInmutables.has(s.id)) sismosInmutables.set(s.id, s.es_anomalia);
                    else if (sismosInmutables.get(s.id) === false) s.es_anomalia = false;

                    const color = s.es_anomalia ? "#f1c40f" : "#ff4d4d";
                    if (!s.es_anomalia) haySismoRojo = true;

                    L.circleMarker([s.lat, s.lng], { 
                        radius: s.mag_original * 3.8, 
                        fillColor: color, 
                        color: "#fff", 
                        weight: 1.5, 
                        fillOpacity: 0.85 
                    }).addTo(sismosLayer);

                    // Creamos el elemento en la interfaz detallando las fuentes combinadas
                    const div = document.createElement('div');
                    div.className = s.es_anomalia ? 'item anomalia-ia' : 'item sismo-real';
                    
                    const fuentesTexto = s.fuentes.join(', ');
                    div.innerHTML = `
                        <span class="mag-text" style="color:${color}">${s.mag_original} Mag</span>
                        <span class="place">${s.place}</span>
                        <span class="sources-badge">📡 ${fuentesTexto}</span>
                    `;
                    
                    if (s.es_anomalia) document.getElementById('anomalias-container').appendChild(div);
                    else document.getElementById('sismos-container').appendChild(div);
                });

                if (sistemaArmado && haySismoRojo) {
                    iniciarSirena();
                    document.getElementById('alarm-status').style.display = 'block';
                } else {
                    detenerSirena();
                }

            } catch (e) { 
                console.error("Error al actualizar datos unificados desde Render:", e); 
            }
        }

        document.getElementById('range-slider').oninput = function() {
            document.getElementById('range-val').innerText = this.value + " km";
            updateSismos(); 
        };
        document.getElementById('mag-slider').oninput = function() {
            document.getElementById('mag-val').innerText = parseFloat(this.value).toFixed(1) + " Mag";
            updateSismos();
        };

        // Primera ejecución
        updateSismos();
        // Consultas automáticas cada 10 segundos
        setInterval(updateSismos, 10000);
    </script>
</body>
</html>
