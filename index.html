<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SismoAlert Chile - Pro + IA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #0a0a0a; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }
        #map { height: 100vh; width: 100%; }
        .dashboard { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(15, 15, 15, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #444; width: 320px; backdrop-filter: blur(10px); }
        
        .status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-size: 11px; color: #aaa; }
        .led { width: 8px; height: 8px; border-radius: 50%; background: #27ae60; margin-right: 5px; display: inline-block; }
        .led-active { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .stat-card { background: #151515; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #ff4444; }
        .stat-val { font-size: 20px; font-weight: bold; display: block; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        
        #event-log { margin-top: 15px; max-height: 200px; overflow-y: auto; font-size: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px; border: 1px solid #333; }
        #event-log::-webkit-scrollbar { width: 6px; }
        #event-log::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        
        .log-item { border-bottom: 1px solid #222; padding: 8px 0; display: flex; justify-content: space-between; }
        .log-item b { color: #ff4444; }

        #alert-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.2); z-index: 9998; pointer-events: none; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { opacity: 0.1; } 50% { opacity: 0.4; } 100% { opacity: 0.1; } }
        
        button { border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-off { background: #27ae60; color: white; }
        .btn-on { background: #e74c3c; color: white; }
        .btn-test { background: #34495e; color: #ccc; font-size: 11px; margin-top: 10px; }
        
        .leaflet-popup-content-wrapper { background: #151515 !important; color: white !important; border: 1px solid #444; }
        .leaflet-popup-tip { background: #151515 !important; }
    </style>
</head>
<body>
    <div id="alert-overlay"></div>
    <div class="dashboard">
        <div class="status-bar">
            <span>SISTEMA: <span id="status-text">CONECTADO</span></span>
            <div id="status-led" class="led"></div>
        </div>
        <h2 style="margin: 0 0 10px 0; font-size: 18px;">🛰️ SismoAlert <span style="color:#ff4444">Chile</span></h2>
        
        <div class="stat-card">
            <span id="dist-display" class="stat-val">2500 km</span>
            <span class="stat-label">Radio de Cobertura</span>
            <input type="range" id="dist-slider" min="100" max="2500" step="100" value="2500" style="width: 100%;">
        </div>

        <div class="stat-card">
            <span id="mag-display" class="stat-val">1.5 Mag</span>
            <span class="stat-label">Sensibilidad Mínima</span>
            <input type="range" id="mag-slider" min="1" max="8" step="0.5" value="1.5" style="width: 100%;">
        </div>

        <button id="btn-toggle" class="btn-off">🔊 ARMAR SISTEMA</button>
        <button id="btn-test" class="btn-test">🛠️ DIAGNÓSTICO DE SISTEMA</button>
        
        <div id="event-log">Sincronizando satélites...</div>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Configuración inicial del mapa
        var map = L.map('map', { zoomControl: true }).setView([-33.45, -70.66], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        var userLocation = { lat: -33.45, lng: -70.66 };
        var audioCtx = null;
        var alarmInterval = null;
        var alertRadius = 2500;
        var minMagnitude = 1.5;
        var alertaHabilitada = false;
        var capaSismos = L.layerGroup().addTo(map);
        var radioVisual = L.circle(userLocation, {radius: 2500000, color: '#ff4444', weight: 1, fillOpacity: 0.05}).addTo(map);

        // --- FUNCIÓN DE PREDICCIÓN POR IA (AL HACER CLIC) ---
        function onMapClick(e) {
            const lat = e.latlng.lat.toFixed(4);
            const lng = e.latlng.lng.toFixed(4);

            const popup = L.popup()
                .setLatLng(e.latlng)
                .setContent('<div style="color:white; background:#151515; padding:5px;">🧠 IA Analizando...</div>')
                .openOn(map);

            fetch(`http://127.0.0.1:8000/prediccion_ia?lat=${lat}&lng=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        popup.setContent(`
                            <div style="text-align:center; padding:10px; min-width:150px;">
                                <b style="color:#00ff88; font-size:12px;">🧠 PREDICCIÓN IA</b><br>
                                <hr style="border:0.5px solid #444; margin:8px 0;">
                                <span style="font-size:22px; font-weight:bold;">${data.magnitud_predicha}</span><br>
                                <small style="color:#aaa;">Magnitud Estimada</small><br>
                                <div style="margin-top:8px; font-size:9px; color:#555;">ZONA: ${lat}, ${lng}</div>
                            </div>
                        `);
                    }
                })
                .catch(err => {
                    popup.setContent("⚠️ Error: ¿Servidor prendido?");
                });
        }

        map.on('click', onMapClick);

        // --- LÓGICA DE ALERTAS Y DATOS ---
        function actualizarCirculo() {
            radioVisual.setLatLng(userLocation).setRadius(alertRadius * 1000);
        }

        document.getElementById('dist-slider').oninput = function() {
            alertRadius = this.value;
            document.getElementById('dist-display').innerText = this.value + " km";
            actualizarCirculo();
            cargarSismos();
        };

        document.getElementById('mag-slider').oninput = function() {
            minMagnitude = parseFloat(this.value);
            document.getElementById('mag-display').innerText = this.value + " Mag";
            cargarSismos();
        };

        function beep() {
            if (!audioCtx || !alertaHabilitada) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.value = 880;
            gain.gain.value = 0.05;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        document.getElementById('btn-toggle').onclick = function() {
            alertaHabilitada = !alertaHabilitada;
            this.className = alertaHabilitada ? "btn-on" : "btn-off";
            this.innerHTML = alertaHabilitada ? "🛑 SILENCIAR" : "🔊 ARMAR SISTEMA";
            if (alertaHabilitada && !audioCtx) audioCtx = new AudioContext();
        };

        function cargarSismos() {
            const led = document.getElementById('status-led');
            led.classList.add('led-active');
            
            fetch("http://127.0.0.1:8000/sismos")
                .then(res => res.json())
                .then(data => {
                    capaSismos.clearLayers();
                    let logHTML = "";
                    let hayAlertaActiva = false;

                    data.forEach(s => {
                        let dist = map.distance(userLocation, [s.lat, s.lng]) / 1000;
                        let horaStr = new Date(s.time).toLocaleTimeString();

                        if (s.mag >= minMagnitude) {
                            if (dist <= alertRadius) {
                                logHTML += `<div class="log-item"><span><b>${s.mag}</b> - ${s.place}</span> <small>${horaStr}</small></div>`;
                                hayAlertaActiva = true; 
                            }
                            
                            L.circle([s.lat, s.lng], { 
                                radius: s.mag * 5000, 
                                color: s.mag >= 5 ? '#ff4444' : '#ffa500', 
                                fillOpacity: 0.5,
                                weight: 2
                            }).bindPopup(`
                                <div style="text-align:center">
                                    <b style="font-size:16px; color:#ff4444">${s.mag} Mag</b><br>
                                    <span>${s.place}</span><br>
                                    <small style="color:#888">${horaStr}<br>${Math.round(dist)}km de distancia</small>
                                </div>
                            `).addTo(capaSismos);
                        }
                    });

                    document.getElementById('event-log').innerHTML = logHTML || "Sin actividad en rango";
                    
                    if (hayAlertaActiva && alertaHabilitada) {
                        document.getElementById('alert-overlay').style.display = 'block';
                        if (!alarmInterval) alarmInterval = setInterval(beep, 600);
                    } else {
                        document.getElementById('alert-overlay').style.display = 'none';
                        clearInterval(alarmInterval); alarmInterval = null;
                    }
                    setTimeout(() => led.classList.remove('led-active'), 500);
                })
                .catch(e => console.log("Esperando conexión..."));
        }

        document.getElementById('btn-test').onclick = function() {
            if(!audioCtx) audioCtx = new AudioContext();
            document.getElementById('alert-overlay').style.display = 'block';
            let tInt = setInterval(beep, 200);
            setTimeout(() => { 
                clearInterval(tInt); 
                document.getElementById('alert-overlay').style.display = 'none';
            }, 2000);
        };

        cargarSismos();
        setInterval(cargarSismos, 30000);
    </script>
</body>
</html>
